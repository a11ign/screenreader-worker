# Weekly, one grouped pull request per ecosystem for patch and minor updates; a major is its own pull request; the packages frozen by policy are never proposed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Etc/UTC
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # FROZEN: in the fleet's pins manifest (control deploy-pins.json `layers`, A11-205): the fleet runs the release it pins
      - dependency-name: "@a11ign/screenreader-worker"
      # FROZEN: in the fleet's pins manifest (control deploy-pins.json `layers`, A11-205): the fleet runs the release it pins
      - dependency-name: "@a11ign/screenreader-fleet"
      # FROZEN: its version picks the NVDA version CI evidence runs on (a11ign/a11ign ADR 0033): a move needs a recapture and a fleet-wide change
      - dependency-name: "@guidepup/guidepup"
      # FROZEN: its version picks the NVDA version CI evidence runs on (a11ign/a11ign ADR 0033): a move needs a recapture and a fleet-wide change
      - dependency-name: "@guidepup/setup"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
      timezone: Etc/UTC
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
