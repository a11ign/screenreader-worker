# The publish path. IT RELEASES ON THE MERGE ITSELF: a push to `main` that carries a changeset no tag has consumed is versioned on a
# detached commit, published, tagged and released, with NOBODY TYPING AND NO VERSION PULL REQUEST (the chairman's CI/CD direction,
# a11ign/a11ign#928; row a11ign/a11ign#3714). `main` is never written: its versions and changelogs lag the last tag, and nothing reads them.
# This repository releases on its own, not with `a11ign/a11ign` (ADR 0041; row a11ign/a11ign#2701).
#
# THIS FILE IS A CALLER, and holds only what is this repository's. The release itself is `release-per-merge.yml`, one reusable workflow for
# every repository (row a11ign/a11ign#3712), pinned below by FULL SHA and moved by Dependabot's `github-actions` entry in a pull request.
# Where each thing the version-pull-request `publish` job refused now lives:
#   the tests passed   `ci`'s `gate` job runs lint, typecheck and `pnpm test`; the called workflow's first job waits for that check to have
#                      SUCCEEDED on this exact sha and never re-runs it
#   access is public   the called workflow's `publish` job reads `.changeset/config.json` before it sends anything
#   npm 11.5.1 or up   the same job installs it and refuses a lower one, because trusted publishing needs it
# The file name below is the one npm's trusted-publisher entry for `@a11ign/screenreader-worker` names (repository
# `a11ign/screenreader-worker`, workflow `release.yml`, environment `npm-publish`): the OIDC token names the CALLING file, so renaming this
# file breaks the publish. The environment itself is on the publishing job of the called file: GitHub refuses `environment:` on a job that
# calls a reusable workflow.
#
# NO STORED REGISTRY TOKEN AND NO `A11IGN_BOT_TOKEN`: there is no pull request to open, so nothing here needs the bot. The publish
# authenticates with the OIDC token the called workflow's `publish` job is minted in the `npm-publish` environment (limited to `main`),
# which is why this job holds `id-token: write`: a called workflow can keep or reduce a permission and never gain one.
name: release

on:
  # NO `workflow_dispatch`, ON PURPOSE: a workflow file on a branch is the branch author's, and the publish holds `id-token: write`, so a
  # dispatch from an unreviewed branch could reach an irreversible publish without `main`'s approving review. A failed release is re-run
  # from its push run (same sha on `main`): the registry and the tags are the state, and the called workflow recomputes the same release.
  push:
    branches: [main]

jobs:
  release:
    permissions:
      contents: write
      checks: read
      id-token: write
    # ONE RELEASE AT A TIME, AND NEVER CANCELLED IN FLIGHT: a publish cancelled half way cannot be rolled back. The called workflow carries the
    # same block; where GitHub honours neither, two runs end in a refused push of a tag, never a moved one.
    concurrency:
      group: release
      cancel-in-progress: false
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@5ea3fc027eb0891d6329e6a02c2d4ed1c679178a
    with:
      kind: npm
      gate-check: gate
