# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests, and the single job below
# is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the tests here drive nothing real. Anything that needs NVDA on Windows is skipped with its
# reason printed, and the worker's own capture checks run on the fleet, from the repository that owns the fleet.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Lint and typecheck gated every pull request in a11ign/a11ign ("CI gates on both") and were dropped by the move
      # (#3179). They run before the tests so a style or type failure reads red without waiting for the suite.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
