# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests (`checks`) and the changeset check
# (`changeset`) and, when the change touches how the tree installs, the release's version step on a scratch clone (`release-dry-run`), and the
# last job below, `gate`, waits for all three. It is named `gate` because that is the check `main`'s protection and the
# `merge-queue-main` ruleset require (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the tests here drive nothing real. Anything that needs NVDA on Windows is skipped with its
# reason printed, and the worker's own capture checks run on the fleet, from the repository that owns the fleet.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat
  # would leave the check red on a body that is now right. The cost is the whole gate once per body edit, which is deliberate: the concurrency
  # group below cancels the run an edit interrupts, so an edit must run everything or it would cancel a full run for a partial one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127, the class fix for #4084: screenreader-worker#25 and #26 changed
  # shipped code with none and released nothing). `releasable-paths` is this repository's `dora` entry's `releasablePaths` in a11ign/a11ign
  # `.agent-org/project.json`, joined by a space and character for character: the worker's entry was wrong until #4092, and a path that matches
  # nothing passes every pull request. On a merge-group entry the called job succeeds without evaluating (the pull request's own run decided).
  # Pinned by full sha, as `release.yml` pins its shared workflow; Dependabot's `github-actions` entry moves the pin.
  changeset:
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone makes GitHub refuse the whole run at
    # startup (`startup_failure`: no job, no log). The called workflow reads the pull request's files, so it needs `pull-requests: read` too.
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@745b552ed550f44cc15c9d797718d350730540ce
    with:
      releasable-paths: src/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # ADR 0043, Decision 7: one package at the root, no workspace file. The check fails on a workspace of one package, a directory not named for
      # its package, a second README for one package and a leftover `lerna.json`, and prints which. Run through `node` because 0.1.5's `bin` has no
      # shebang, so `pnpm exec layout-check` is read by `sh` and exits 2 (filed on a11ign/a11ign, see the pull request).
      - run: node node_modules/@a11ign/toolchain/dist/layout-check.mjs
      # The build comes first because the package is published BUILT (`prepack` runs it at publish), so a build that fails must read red here
      # and not at the release. The tests run on `src` and do not need it; the typecheck and the lint do not either.
      - run: pnpm run build
      # Lint and typecheck gated every pull request in a11ign/a11ign ("CI gates on both") and were dropped by the move
      # (#3179). They run before the tests so a style or type failure reads red without waiting for the suite.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (a11ign/agent-org#885 class 3, a11ign/agent-org#888; chairman direction a11ign/a11ign#4988).
  # `release.yml` calls `a11ign/toolchain`'s `release-per-merge.yml`, and nothing on a pull request ran the path that workflow's `version` job takes, so a change to the install
  # passed `checks` and was first seen as a failed release on `main`. This job runs those commands (with a lockfile: `pnpm install --frozen-lockfile`, the repository's OWN
  # `changeset version`, then `pnpm install --lockfile-only`; without one: `pnpm dlx @changesets/cli@<changesets-version> version`) in a scratch clone of the candidate tree and writes
  # nothing: `contents: read`, no credential kept by the checkout, no push, no token. Copied from a11ign/agent-org#967's `release-dry-run` and adapted to THIS repository's call.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per WORKFLOW and not
  # per job, and a workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it: an untouched change is a
  # `success` here, never a skip, and `gate` keeps accepting `success` alone. The paths are judged against the first parent of the checked-out commit: the merge ref of a pull request
  # or a merge-queue entry.
  #
  # THE TOOLS ARE THE RELEASE'S, AS `release.yml` CALLS IT: that call sets no `pnpm-version`, `changesets-version` or `node-version`, so the release reads pnpm from `package.json`'s
  # `packageManager` (which `pnpm/action-setup` does here too, given no `version`), and takes the called workflow's defaults for the rest: Node `22` and changesets `3.0.3`
  # (`release-per-merge.yml`'s `node-version` and `changesets-version` inputs at the sha `release.yml` pins). `CHANGESETS_VERSION` below is used only on the no-lockfile path, as there.
  # A bump of that pin in `release.yml` is a change to these two lines in the same pull request. It versions EVERY changeset in the tree, where the release versions only those no tag
  # has consumed: a superset, so a failure the release would meet is met here.
  #
  # NO SECOND STEP FOR A CONSUMER'S INSTALL OF A TAG (a11ign/agent-org#967 has one). a11ign's `agent-org-newest-tag` clones `a11ign/agent-org` alone, and this repository's tag is
  # consumed two other ways: `scripts/lay-layer.ts` in a11ign/a11ign takes a depth-1 clone of `v<semver>` and copies `src/`, installing nothing, and everything else installs the
  # published package from the registry by a11ign's own lockfile. Nothing runs `pnpm install --frozen-lockfile --ignore-scripts` on a clone of this repository's tag, so that step
  # would certify an install no consumer performs.
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHANGESETS_VERSION: 3.0.3
    steps:
      - uses: actions/checkout@v7
        with:
          # THE WHOLE HISTORY, AS THE RELEASE'S OWN CHECKOUT TAKES IT (`fetch-depth: 0`): `changeset version` asks git which commit added each
          # changeset, deepens a shallow clone to find out, and a shallow workspace cloned shallow again dies with `fatal: shallow file has changed
          # since we read it` (the first run of this job, a11ign/a11ign#5061). `touched` compares HEAD with its first parent and needs two commits
          # only. No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      # No `version`: the action reads `packageManager`, as the release's `setup` step leaves it empty to do.
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm exec changeset version
            pnpm install --lockfile-only
          else
            pnpm dlx "@changesets/cli@$CHANGESETS_VERSION" version
          fi

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It
  # waits for the three jobs above and accepts `success` ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts
  # as passed; and no `skipped` allowance, because the changeset job succeeds on a merge-group entry rather than skipping, and `release-dry-run` succeeds
  # without working when no install path changed, so a skip here means a job did not run.
  gate:
    needs: [changeset, checks, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          for result in "${{ needs.changeset.result }}" "${{ needs.checks.result }}" "${{ needs.release-dry-run.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a job reported '$result', not success"
              exit 1
            fi
          done
