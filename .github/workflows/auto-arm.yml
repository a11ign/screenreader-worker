# Enable auto-merge on every open, non-draft pull request against `main`, so nobody arms by hand (a11ign/a11ign#3383).
#
# `gh pr merge --auto` only ARMS the merge. GitHub still withholds it until `main`'s approving review and the
# `gate` check are satisfied, and the merge queue (`merge-queue-main`) builds it on top of `main` first, so arming
# early costs nothing and removes "a session has to notice" as a step in a pull request's life. Before this file
# existed, a11ign/a11ign#2701's row records five pull requests (#3, #4, #5, #6, #8) armed by hand.
#
# This is a deliberately SMALL copy of a11ign/a11ign's `auto-arm.yml`, not a port. That one runs `agent-org arm-pr`, which
# reads `.agent-org/project.json` and `.agent-org/roles/sessions.json` from the checkout it runs in; this repository
# declares no org project, so installing the tool here would mean copying that declaration and keeping it in step. What
# the tool decides that matters here is one rule, and it is stated below: a `hold:` label is a hold.
#
# ONE JOB ASKS THE REPOSITORY'S QUESTION, NOT THE EVENT'S PULL REQUEST'S. A pull request that was open before this file
# merged has no `opened` left to fire, and a Dependabot pull request's own event runs with a read-only token. Listing
# every open pull request on each event covers both, and arming is idempotent: a pull request already armed is skipped.
# `workflow_dispatch` is the manual kick for a quiet repository; there is no `schedule`, because GitHub disables
# scheduled workflows after 60 days without activity and a sweep that stops silently reads as slow reviewers.
#
# AN APPROVING REVIEW MARKS A DRAFT READY AND ARMS IT (a11ign/a11ign#4969, ported here by a11ign/a11ign#5045). `arm` ignores drafts and no event of
# its own fires on a review, so the review is the trigger: `relay` (on `pull_request_review`) hands the pull request number to `main`'s copy of
# this file, and `arm-approved` (on `workflow_dispatch`, which the policy already accepts) marks it ready and arms it. `pull_request_review` runs
# the BRANCH'S copy of the file, so no job that mints may ride it: `relay` holds `actions: write` on `GITHUB_TOKEN` and mints nothing.
#
# `pull_request_target` and NOT `pull_request`, for the Dependabot case above: it runs the workflow from `main` with a
# write token. That trigger is unsafe only when the job checks out or runs the pull request's code, and this job has no
# checkout and runs nothing from the pull request: it reads labels through the API and calls `gh pr merge`.
#
# THE ARMING TOKEN IS AN OCTO STS APP TOKEN, NOT A STORED ONE (a11ign/a11ign#4199; a11ign/a11ign#4198 did a11ign/a11ign). A merge
# completed with `GITHUB_TOKEN` fires no workflow events (a11ign/a11ign#416), so `release.yml`'s `push` trigger would not fire after a merge
# this job armed; a merge armed with an app installation token is attributed to that identity and does. `octo-sts/action` mints one per
# run against `.github/chainguard/auto-arm.sts.yaml` and revokes it in its post step, so nothing is stored. There is NO fallback to
# `GITHUB_TOKEN`: a fallback arms with the token that fires nothing, which is #416's defect restored quietly, and a failed mint is a step
# that names itself (this job is `continue-on-error`, so it is an annotation). A policy is read from the DEFAULT branch (octo-sts/app
# v0.11.2), so a pull request that adds or changes it takes effect when it merges.
#
# THIS JOB RUNS `main`'s COPY OF THIS FILE, NEVER A BRANCH'S. `pull_request` would run the branch's copy (`job_workflow_ref` =
# `...@refs/pull/N/merge`, measured on a11ign/a11ign#4191), so no policy could bind it to `main`; `pull_request_target`, `push` and
# `workflow_dispatch` on `main` all run `main`'s, and the policy pins `job_workflow_ref` to `@refs/heads/main`. The token goes through
# `env:` into `GH_TOKEN`, never an argument.
name: auto-arm

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  # #4969: an APPROVING review is the event on which a draft's wait ends. It runs the file as the PR's merge ref has it, the BRANCH'S copy, so
  # only `relay` rides it (no mint, no policy claim) and `arm-approved` is the `workflow_dispatch` half, which runs `main`'s copy.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to ready (if still a draft) and arm, when it is approved. Empty runs the sweep only (#4969)"
        required: false
        type: string

jobs:
  arm:
    # The sweep's own group, on the JOB: a workflow-level group would also hold `relay` and `arm-approved`, and a group keeps one running and
    # ONE PENDING run, so a review landing while the sweep ran could replace the pending dispatch that is the whole point of this file.
    concurrency:
      group: auto-arm
      cancel-in-progress: false
    # `pull_request_review` runs the branch's copy and the sweep minted nothing there before; a dispatch carrying a `pr` is `arm-approved`'s.
    if: github.event_name != 'pull_request_review' && github.event.inputs.pr == ''
    # It acts on pull requests other than the one whose event woke it, and gates nothing (`main` requires `gate` only),
    # so a failure is an annotation and never a red check charged to a diff that did not earn it.
    continue-on-error: true
    # The job's own `GITHUB_TOKEN` holds only what the job itself needs: a checkout (`contents: read`) and the OIDC request Octo STS needs (`id-token: write`).
    # The writes come from the minted token, whose grant is `auto-arm.sts.yaml`'s.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # The base branch's own copy of `.github/auto-arm.jq`: on `pull_request_target` a checkout WITHOUT `ref:` is `main`,
      # never the pull request, so this still runs nothing a pull request wrote.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/auto-arm.jq
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Arm every open, non-draft, unheld pull request against main that nothing has armed
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `--limit 200` and not the default 30: a list that silently stops at 30 is a sweep that quietly arms 30.
          # The selection is `.github/auto-arm.jq`, which `scripts/auto-arm-filter.test.ts` runs in the gate.
          numbers=$(gh pr list --state open --base main --limit 200 \
            --json number,isDraft,labels,autoMergeRequest | jq -r -f .github/auto-arm.jq)
          failed=0
          for n in $numbers; do
            if gh pr merge --auto --merge "$n"; then
              echo "ARMED #$n"
            else
              echo "::error::could not arm #$n"
              failed=1
            fi
          done
          [ -n "$numbers" ] || echo "nothing to arm: every open, non-draft, unheld pull request is already armed"
          exit "$failed"

  # ## An approving review marks a draft ready and arms it, with no worker turn (a11ign/a11ign#4969, ported by a11ign/a11ign#5045)
  #
  # TWO JOBS, BECAUSE THE EVENT RUNS THE BRANCH'S FILE. `relay` is the only job `pull_request_review` runs: it holds `actions: write` on
  # `GITHUB_TOKEN`, mints nothing and sends the PR number to `main`'s copy (`gh workflow run --ref main`; a dispatch made with `GITHUB_TOKEN` is
  # one of the two events that DOES start a run). A branch that edits `relay` gains nothing it did not have: any branch workflow could already
  # dispatch. `arm-approved` then runs as `workflow_dispatch` on `refs/heads/main`, which `auto-arm.sts.yaml` already accepts
  # (`event_name: pull_request_target|push|workflow_dispatch`), so the policy gains no claim and the `job_workflow_ref` binding is untouched.
  #
  # THE DISPATCH IS NOT TRUSTED FOR THE DECISION. `arm-approved` re-reads the PR as the minted token and acts only on `reviewDecision ==
  # APPROVED` (what branch protection itself waits on), an open PR against `main`, a head in this repository and no `hold:` label. A held,
  # forked, closed, CHANGES_REQUESTED or already-armed pull request is left untouched: nothing marks it ready either.
  relay:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Hand the approved pull request to `main`'s copy of this workflow (#4969)
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # `main` declares no `pr` input until this change has landed, and GitHub then answers 422 "Unexpected inputs provided": there is
          # nothing to hand the number to yet, which is not this pull request's failure. Any OTHER refusal stays red.
          if ! out=$(gh workflow run auto-arm.yml --repo "$REPOSITORY" --ref main -f pr="$PULL_REQUEST" 2>&1); then
            case "$out" in
              *"Unexpected inputs provided"*) echo "::notice::main's copy of auto-arm.yml declares no pr input yet, so there is nothing to hand #${PULL_REQUEST} to"; exit 0 ;;
            esac
            echo "$out" >&2
            exit 1
          fi

  arm-approved:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.pr != ''
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Mark an approved draft ready and arm it -- unless held, forked, closed or not against main (#4969)
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.inputs.pr }}
        run: |
          case "$PULL_REQUEST" in ''|*[!0-9]*) echo "::error::AUTO-ARM: pr input '$PULL_REQUEST' is not a pull request number"; exit 1;; esac
          # An approval is readable a moment after the review event, so a dispatch that outruns it asks again before it refuses.
          for attempt in 1 2 3; do
            pr=$(gh pr view "$PULL_REQUEST" --json state,baseRefName,isCrossRepository,reviewDecision,isDraft,labels,autoMergeRequest)
            [ "$(jq -r .reviewDecision <<<"$pr")" = APPROVED ] && break
            sleep 5
          done
          verdict=$(jq -r '
            [.labels[].name | select(startswith("hold:"))] as $holds
            | if .state != "OPEN" then "skip: the pull request is " + .state
              elif .baseRefName != "main" then "skip: its base is " + .baseRefName + ", not main"
              elif .isCrossRepository then "skip: its head is in a fork"
              elif .reviewDecision != "APPROVED" then "skip: reviewDecision is \(.reviewDecision | if . == "" then "empty" else . end), not APPROVED"
              elif ($holds | length) > 0 then "skip: held by " + ($holds | join(", "))
              elif .isDraft then "ready"
              elif .autoMergeRequest != null then "skip: already armed"
              else "arm" end' <<<"$pr")
          case "$verdict" in
            skip:*) echo "AUTO-ARM: leaving #${PULL_REQUEST} in ${GH_REPO} untouched -- ${verdict#skip: }"; exit 0;;
            ready) echo "AUTO-ARM: #${PULL_REQUEST} is an approved draft: marking it ready"; gh pr ready "$PULL_REQUEST";;
          esac
          gh pr merge --auto --merge "$PULL_REQUEST"
          echo "ARMED #${PULL_REQUEST}"
